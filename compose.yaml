name: reconstroi

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconstroi}
      POSTGRES_USER: ${POSTGRES_USER:-reconstroi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-reconstroi}
      DATABASE_USERNAME: ${POSTGRES_USER:-reconstroi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JPA_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIRECTORY: /app/uploads
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
    expose: ["8081"]
    volumes:
      - uploads_data:/app/uploads
    networks: [internal]

  frontend:
    build:
      context: ./front
      args:
        API_INTERNAL_URL: http://backend:8081
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    networks: [internal]

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
    driver: bridge
