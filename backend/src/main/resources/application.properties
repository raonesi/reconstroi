spring.application.name=backend
# Ao rodar pelo NetBeans/IDE, usa a mesma configuração local do ReConstroi.exe (senha do banco etc.).
# Variáveis de ambiente continuam tendo prioridade; se o arquivo não existir, é ignorado.
spring.config.import=optional:file:${LOCALAPPDATA:}/ReConstroi/reconstroi.env[.properties]
server.port=${SERVER_PORT:8081}
# Por padrão a API só aceita conexões deste computador (o desktop roda na mesma máquina).
# No Docker o compose define SERVER_ADDRESS=0.0.0.0.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reconstroi}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
# Devolver o token de redefinição na resposta só serve para uso local sem e-mail.
# Mesmo ligado, o UsuarioService só devolve o token se a API estiver presa ao 127.0.0.1.
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:false}
app.upload.directory=${UPLOAD_DIRECTORY:uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:5242880}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.mail.enabled=${MAIL_ENABLED:false}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${MAIL_ENABLED:false}

server.error.include-message=never
server.error.include-stacktrace=never
